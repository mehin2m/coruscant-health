{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3">Register</h3>
      <p class="text-muted">Patients and doctors must be approved by an Administrator before logging in.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-brand w-100">Create account</button>
      </form>
      <p class="mt-3 text-center"><a href="{% url 'accounts:login' %}">Already have an account? Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
