{% extends "base.html" %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-list-task"></i> Pending Orders</h3>
{% for o in orders %}
<div class="card p-3 mb-2 d-flex flex-row justify-content-between align-items-center">
  <div>
    <strong>{{ o.get_order_type_display }}</strong> for {{ o.patient.user.username }}
    <div class="text-muted small">Ordered by Dr. {{ o.doctor.user.username }} · {{ o.created_at }}</div>
  </div>
  <a href="{% url 'departments:execute_order' o.id %}" class="btn btn-sm btn-brand">Execute</a>
</div>
{% empty %}
<p class="text-muted">No pending orders.</p>
{% endfor %}
{% endblock %}
