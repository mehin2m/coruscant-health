{% extends "base.html" %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-clipboard2-pulse"></i> My Patients</h3>
<div class="row g-3">
  {% for p in patients %}
  <div class="col-md-4">
    <div class="card p-3">
      <h5>{{ p.user.username }}</h5>
      <a href="{% url 'doctors:patient_detail' p.id %}" class="btn btn-sm btn-brand">View record</a>
    </div>
  </div>
  {% empty %}
    <p class="text-muted">No patients assigned yet.</p>
  {% endfor %}
</div>
{% endblock %}
