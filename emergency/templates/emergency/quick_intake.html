{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3"><i class="bi bi-lightning-charge-fill text-danger"></i> Quick Patient Intake</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger w-100">Register Now</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
